<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Mobile-first GenAI / Agentic AI Engineer interview preparation app." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GenAI Prep" />
  <title>GenAI Engineer Interview Prep</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">✦</span>
          <div>
            <p class="kicker">Interview Prep</p>
            <h1>GenAI Engineer</h1>
          </div>
        </div>
        <button id="closeSidebarBtn" class="icon-btn desktop-hidden" type="button" aria-label="Close menu">✕</button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-route="#/home" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-route="#/categories" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zm-9 9h7v7H4zm9 0h7v7h-7z"/></svg>
          <span>Categories</span>
        </button>
        <button class="nav-item" data-route="#/bookmarks" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>
          <span>Bookmarks</span>
        </button>
        <button class="nav-item" data-route="#/progress" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
          <span>Progress</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="themeBtn" class="ghost-btn" type="button">
          <span class="theme-icon" aria-hidden="true">◐</span>
          <span id="themeLabel">Dark mode</span>
        </button>
        <button id="installBtnSide" class="primary-btn" type="button" hidden>Install app</button>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <div class="main-shell">
      <header class="topbar">
        <button id="openSidebarBtn" class="icon-btn desktop-hidden" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div class="title-wrap">
          <h2 id="screenTitle">Home</h2>
          <p id="screenSubtitle" class="kicker">GenAI Engineer prep</p>
        </div>
        <button id="themeBtnTop" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <span id="themeIconTop" aria-hidden="true">🌙</span>
        </button>
        <button id="installBtnTop" class="primary-btn compact" type="button" hidden>Install</button>
      </header>

      <section class="controls" id="controlsBar">
        <label class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
          <span class="visually-hidden">Search questions and answers</span>
          <input id="searchInput" type="search" placeholder="Search 260 questions..." autocomplete="off" />
        </label>
        <div class="filter-row">
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>
          <select id="difficultyFilter" aria-label="Filter by difficulty">
            <option value="all">Any difficulty</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </section>

      <main id="main" class="content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Mobile navigation">
        <button class="bottom-nav-item active" data-route="#/home" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </button>
        <button class="bottom-nav-item" data-route="#/categories" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zm-9 9h7v7H4zm9 0h7v7h-7z"/></svg>
          <span>Topics</span>
        </button>
        <button class="bottom-nav-item" data-route="#/bookmarks" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>
          <span>Saved</span>
        </button>
        <button class="bottom-nav-item" data-route="#/progress" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
          <span>Progress</span>
        </button>
      </nav>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
