<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Mobile-first GenAI / Agentic AI Engineer interview preparation app." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GenAI Prep" />
  <title>GenAI Engineer Interview Prep</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <div>
          <p class="kicker">Interview Prep</p>
          <h1>GenAI Engineer</h1>
        </div>
        <button id="closeSidebarBtn" class="icon-btn desktop-hidden" type="button" aria-label="Close menu">✕</button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-route="#/home" type="button">Home</button>
        <button class="nav-item" data-route="#/categories" type="button">Categories</button>
        <button class="nav-item" data-route="#/bookmarks" type="button">Bookmarks</button>
        <button class="nav-item" data-route="#/progress" type="button">Progress</button>
      </nav>

      <div class="sidebar-footer">
        <button id="themeBtn" class="ghost-btn" type="button">Toggle theme</button>
        <button id="installBtnSide" class="primary-btn" type="button" hidden>Install app</button>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <div class="main-shell">
      <header class="topbar">
        <button id="openSidebarBtn" class="icon-btn desktop-hidden" type="button" aria-label="Open menu">☰</button>
        <div class="title-wrap">
          <p class="kicker">Mobile-first study app</p>
          <h2 id="screenTitle">Home</h2>
        </div>
        <button id="installBtnTop" class="primary-btn" type="button" hidden>Install</button>
      </header>

      <section class="controls">
        <label class="search-field">
          <span class="visually-hidden">Search questions and answers</span>
          <input id="searchInput" type="search" placeholder="Search questions, answers, technologies..." autocomplete="off" />
        </label>
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
        <select id="difficultyFilter" aria-label="Filter by difficulty">
          <option value="all">All difficulty levels</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </section>

      <main id="main" class="content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Mobile navigation">
        <button class="bottom-nav-item active" data-route="#/home" type="button">Home</button>
        <button class="bottom-nav-item" data-route="#/categories" type="button">Categories</button>
        <button class="bottom-nav-item" data-route="#/bookmarks" type="button">Saved</button>
        <button class="bottom-nav-item" data-route="#/progress" type="button">Progress</button>
      </nav>
    </div>
  </div>

  <template id="codeBlockTemplate">
    <div class="code-wrap">
      <div class="code-head">
        <span class="code-lang"></span>
        <button type="button" class="copy-btn">Copy</button>
      </div>
      <pre><code></code></pre>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
